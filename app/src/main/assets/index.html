<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1117"><title>Batyr’s Way — Путь батыра</title><style>
:root{color-scheme:dark;--bg:#0a0e14;--card:#171c24;--edge:#494034;--gold:#f0c66d;--gold2:#aa7536;--muted:#abb5be;--white:#f5f0e7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090d12;color:var(--white);font:15px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}body{background:radial-gradient(ellipse at 50% -10%,#40352a 0,transparent 52%),#090d12}.shell{width:min(100%,480px);min-height:100dvh;margin:auto;background:linear-gradient(180deg,#111923,#0a0e14 45%);box-shadow:0 0 50px #0008;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 17px 8px}.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:21px;font-family:Georgia,'Times New Roman',serif;font-weight:700}.logo{font-size:26px}.badge{padding:5px 11px;border:1px solid #947444;border-radius:9px;color:var(--gold);font-size:12px;font-weight:700}main{padding:0 13px 28px;flex:1}.heroScene{height:365px;position:relative;overflow:hidden;border:1px solid #655239;border-radius:19px;background:linear-gradient(180deg,#192430,#433c38 62%,#161b1c 100%)}.sky{position:absolute;inset:0;background:radial-gradient(circle at 79% 19%,#f3be7060 0,#dcb37921 12%,transparent 32%)}.mount{position:absolute;left:-10%;width:120%;background:#131b20;bottom:0;clip-path:polygon(0 35%,10% 24%,19% 31%,34% 8%,43% 28%,56% 12%,70% 34%,83% 10%,100% 25%,100% 100%,0 100%)}.mount.a{height:56%;opacity:.7}.mount.b{height:38%;background:#151e22;clip-path:polygon(0 42%,15% 12%,31% 39%,49% 3%,63% 43%,77% 17%,100% 44%,100% 100%,0 100%)}.ground{position:absolute;inset:auto 0 0;height:19%;background:linear-gradient(180deg,#414032,#121815)}.yurt{position:absolute;bottom:18px;left:12px;width:104px;height:70px;opacity:.7}.yurt:before{content:'';position:absolute;width:100%;height:45px;background:#bda878;clip-path:polygon(50% 0,100% 73%,100% 100%,0 100%,0 73%)}.yurt:after{content:'';position:absolute;bottom:0;width:100%;height:33px;background:linear-gradient(90deg,#85755b 0 42%,#2c2421 42% 61%,#85755b 61%);border-radius:4px 4px 15px 15px}.wolf{position:absolute;right:12px;bottom:12px;font-size:48px;filter:grayscale(1) brightness(.7);opacity:.65}.heroArtwork{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);height:95%;max-width:100%;object-fit:contain;filter:drop-shadow(0 7px 14px #000d)}.sceneText{position:absolute;top:10px;left:12px;padding:7px 10px;border-radius:10px;background:#0d111aab;color:#ffe6ab;font-size:12px;font-weight:700;max-width:60%;z-index:2}.heroStats{display:flex;align-items:center;gap:12px;padding:10px 4px 7px}.lvl{min-width:70px;min-height:69px;border:2px solid var(--gold2);clip-path:polygon(50% 0%,90% 17%,90% 76%,50% 100%,10% 76%,10% 17%);background:#271c13;display:grid;place-content:center;text-align:center;color:var(--gold);font-weight:700;font-size:12px}.lvl b{font-size:21px}.grow{flex:1}.grow strong{color:var(--gold);font-size:14px}.progress{height:9px;background:#34383e;border-radius:20px;overflow:hidden;margin-top:7px}.progress>div{height:100%;background:linear-gradient(90deg,#b88039,#ffe48f);border-radius:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{border:1px solid var(--edge);border-radius:16px;padding:13px;background:linear-gradient(145deg,#22262b,#131920);margin:10px 0}.card h2{font-size:17px;margin:0 0 8px;color:var(--gold)}.card p{margin:5px 0 12px;color:var(--muted);font-size:13px}.small{font-size:12px;color:var(--muted)}.caps{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1.3px}.nav{display:flex;position:sticky;bottom:0;z-index:4;background:#0e141b;border-top:1px solid #3a3a38;padding:5px 4px max(7px,env(safe-area-inset-bottom));margin-top:auto}.nav button{flex:1;background:none;border:0;color:#a9adaf;font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;padding:7px 1px;cursor:pointer}.nav button i{font-style:normal;font-size:21px}.nav button.active{color:var(--gold)}.btn{display:block;text-align:center;border:1px solid #c59449;border-radius:12px;padding:12px 11px;font-weight:800;font-size:14px;color:#221810;background:linear-gradient(180deg,#ffe195,#c99643);cursor:pointer;width:100%;min-height:46px}.btn:disabled{opacity:.45;cursor:default}.secondary{background:linear-gradient(180deg,#34363a,#171b23);border-color:#63615a;color:#f5e4bf}.tertiary{background:transparent;color:var(--gold);border-color:#604d32}.row{display:flex;align-items:center;gap:9px}.row .btn{width:auto;flex:1}.field{display:block;width:100%;background:#0c1118;color:white;border:1px solid #71604a;border-radius:9px;padding:11px 10px;font-size:15px;margin:5px 0 11px}label{font-size:12px;color:var(--gold);font-weight:700}.exercise{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;background:linear-gradient(120deg,#24272c,#121720);border:1px solid #45403a;border-radius:12px;margin:8px 0}.exercise strong{font-size:16px}.exercise span{color:var(--muted);font-size:12px}.square{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid #9b783a;color:var(--gold);font-size:20px;cursor:pointer;background:#181a20}.checkrow{display:flex;justify-content:space-between;align-items:center;padding:9px 7px;border-bottom:1px solid #3b3630;font-size:13px;gap:5px}.checkrow input{accent-color:#ecb957;transform:scale(1.3)}.title{font-size:23px;font-weight:800;margin:13px 2px 2px}.muted{color:var(--muted)}.counter{font-size:76px;font-weight:900;color:var(--gold);text-align:center;margin:25px auto 8px;line-height:1}.center{text-align:center}.focus{padding-top:13px}.focus figure{height:200px;margin:13px 0 2px;text-align:center;overflow:hidden;display:flex;align-items:center;justify-content:center}.focus .emoji{font-size:100px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#282014;color:var(--gold);padding:10px 17px;border-radius:15px;border:1px solid #cead65;display:none;z-index:9;box-shadow:0 5px 20px #0009}.overlay{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px}.dialog{width:min(100%,440px);max-height:88vh;overflow:auto;background:#191f28;border:1px solid #ab8846;border-radius:18px;padding:18px}.dialog h2{color:var(--gold);margin:0 0 14px}.miniplayer{display:flex;gap:8px;align-items:center;border:1px solid #534d3e;border-radius:13px;background:#171d23;padding:8px 11px;margin:8px 0;font-size:12px;color:#d4d5d8}.miniplayer button{font:inherit;background:#373024;border:1px solid #7b623a;border-radius:7px;padding:5px 9px;color:var(--gold)}.pill{display:inline-block;padding:4px 8px;border:1px solid #715f39;border-radius:20px;color:var(--gold);font-size:11px}input[type=range]{width:100%;accent-color:var(--gold)}@media(max-width:360px){.brand{font-size:18px}.heroScene{height:330px}}

/* Batyr's Way v0.5 — immersive mobile RPG skin */
:root{--gold:#f7ca75;--gold2:#a77739;--card:#15181e;--edge:#4b4137}
body{background:#080b11}
.shell{background:linear-gradient(180deg,#191f28 0%,#0a0e14 38%,#080b10 100%)}
.top{padding:16px 18px 12px;background:linear-gradient(180deg,#242a33,#161c25)}
.brand{font-size:23px;letter-spacing:.2px;text-shadow:0 1px 14px #e5aa4e44}
.logo{color:#ffda86;text-shadow:0 0 12px #eea83c77}
.badge{background:linear-gradient(145deg,#332b20,#17191c);border:1px solid #d0a457;box-shadow:0 0 12px #ffcc7040}
main{padding:0 16px 25px}
.heroScene{height:420px;border-radius:17px;border:1px solid #836c4d;background:linear-gradient(180deg,#152132,#5c473d 59%,#15171a);box-shadow:0 12px 42px #0009,inset 0 0 24px #0007}
.heroScene:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 45% 40%,transparent 25%,#02040755 80%,#020407cf);z-index:1}
.sky{background:radial-gradient(circle at 79% 19%,#fff0bb80 0,#e2b46b27 13%,transparent 33%)}
.heroArtwork{z-index:2;filter:drop-shadow(0 8px 18px #000e);height:96%}
.sceneText{z-index:3;border:1px solid #9e824d;background:#141419cc;letter-spacing:1px;padding:8px 13px}
.wolf{z-index:2;opacity:.92;filter:grayscale(1) brightness(.75) drop-shadow(0 3px 4px #000)}
.yurt{z-index:2}
.heroStats{margin-top:12px;border:1px solid #5e4b30;border-radius:13px;padding:12px;background:linear-gradient(125deg,#251f1b,#121720)}
.lvl{width:75px;height:77px;border:2px solid #f5cb78;background:linear-gradient(160deg,#44321f,#17161b);text-shadow:0 0 15px #d99340}
.grow strong{font-size:17px}
.card{border-color:#484038;background:linear-gradient(145deg,#26262b,#131820 55%,#11151c);box-shadow:0 6px 18px #0006;overflow:hidden}
.card h2{font-weight:750;color:#f8cf7d}
.btn{background:linear-gradient(180deg,#ffe8aa 0%,#e7b75d 51%,#bb8437 100%);border:1px solid #ffda82;border-radius:12px;box-shadow:inset 0 1px #fff8,0 3px 12px #b47b2850;color:#24190c}
.btn.secondary{background:linear-gradient(180deg,#3a3839,#1b2028);border-color:#655847;color:#f3e3c5;box-shadow:none}
.btn.tertiary{background:#17191d;border-color:#6c542e;color:#f5cc7e;box-shadow:none}
.nav{box-shadow:0 -12px 25px #050609c8;background:#111720;border-top:1px solid #655039;padding:9px 4px max(9px,env(safe-area-inset-bottom))}
.nav button.active{color:#ffe094;text-shadow:0 0 10px #ffce6c55}
.nav button i{font-size:23px}
.exercise{background:linear-gradient(115deg,#2b2c31,#171b22);border-color:#63513b;border-radius:14px}
.title{color:#f4e7d0;letter-spacing:.2px;font-weight:800;font-size:24px}
.caps{color:#e9b761}
.field{background:#11141b;border-color:#79623e;padding:13px 11px;border-radius:11px}
.dialog{background:linear-gradient(140deg,#27252a,#151b23);box-shadow:0 20px 90px #000c}
.focus{padding-top:10px}
.focus h1{font-size:28px;margin:32px 0 14px}
.focus figure{height:195px;border-radius:20px;background:radial-gradient(ellipse at 50% 70%,#54443175,transparent 75%),linear-gradient(180deg,#252932,#0b1016)}
.counter{font-size:67px}
.rewardHeader{font-size:25px;font-weight:800;letter-spacing:.3px;color:#f7d598}
.rewardXp{font-size:62px;color:#ffce70;font-weight:900;text-shadow:0 0 28px #e0a74875;margin:20px 0}
.rewardStats{border:1px solid #6a5237;border-radius:15px;background:linear-gradient(160deg,#2c2520,#13171d);padding:15px;margin:24px 0}
.rewardStats div{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #4b4134}
.rewardStats div:last-child{border-bottom:0}
.rewardStats b{color:#9ad27a}
.stageLine{display:flex;gap:5px;justify-content:space-between;margin:9px 0 15px}
.stageLine span{display:grid;place-items:center;flex:1;min-width:0;border:1px solid #5d4c31;background:#1e2024;padding:5px 3px;border-radius:8px;color:#aa9d89;font-size:10px;text-align:center}
.stageLine span.on{background:linear-gradient(135deg,#50412b,#251b19);border-color:#e9b75c;color:#ffdc96}
.gameRow{display:flex;gap:9px;margin-top:11px}
.gameRow .card{flex:1;margin:0;padding:13px 8px;text-align:center}
.gameRow strong{font-size:23px;color:#f7ce76}
.gameRow .small{display:block}
</style><link rel="stylesheet" href="v06.css"><link rel="stylesheet" href="v07.css"><link rel="stylesheet" href="v08.css"><link rel="stylesheet" href="v09.css"><link rel="stylesheet" href="v10.css"></head><body><div class="shell"><header class="top"><div class="brand"><span class="logo">♛</span> Batyr’s Way</div><div class="badge" id="lvlHeader">Ур. 1</div></header><main id="main"></main><div id="musicStrip"></div><nav class="nav" id="nav"></nav></div><div id="toast" class="toast"></div><div id="modal"></div>
<script>const HERO_IMAGES=["heroes/novice.webp","heroes/fighter.webp","heroes/warrior.webp","heroes/batyr.webp","heroes/legend.webp"];</script><script>

'use strict';
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toLocaleDateString('sv-SE');
let storage={};try{storage=JSON.parse(localStorage.getItem('batyrs-way-app-v05')||'{}')}catch(_){}
const state=Object.assign({xp:0,weight:125,goal:100,style:1,view:'hero',previewStage:0,done:{},awarded:{},dayXp:{},finished:{},ex:[{id:'a1',name:'Отжимания',kind:'Повторения',amount:15,sets:1,weight:0},{id:'a2',name:'Приседания',kind:'Повторения',amount:20,sets:2,weight:0},{id:'a3',name:'Планка',kind:'Секунды',amount:30,sets:1,weight:0}]},storage);
let audio=new Audio();audio.preload='none';let audioName='Музыка не выбрана';let session=null;
const save=()=>{try{localStorage.setItem('batyrs-way-app-v05',JSON.stringify(state))}catch(_){}};
let level=()=>1+Math.floor(state.xp/200);
let stage=()=>level()<=10?1:level()<=25?2:level()<=50?3:level()<=75?4:5;
const ranks=['','Новичок','Боец','Воин','Батыр','Легенда'];
const doneKey=(x,i)=>`${today()}/${x.id}/${i}`;
const isDone=(x,i)=>Boolean(state.done[doneKey(x,i)]);
const setsTotal=()=>state.ex.reduce((a,x)=>a+x.sets,0);
const setsDone=()=>state.ex.reduce((a,x)=>a+Array.from({length:x.sets},(_,i)=>isDone(x,i+1)?1:0).reduce((p,q)=>p+q,0),0);
const badge=(msg)=>{const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.tmo);window.tmo=setTimeout(()=>t.style.display='none',2300)};
const progress=p=>`<div class="progress"><div style="width:${Math.max(0,Math.min(100,p))}%"></div></div>`;
const addXp=x=>{state.xp+=x;save();badge(`+${x} XP • Путь батыра продолжается!`)};
let book=(x,i)=>{let k=doneKey(x,i);state.done[k]=!state.done[k];if(state.done[k]&&!state.awarded[k]){let remaining=Math.max(0,120-(state.dayXp[today()]||0)),reward=Math.min(12,remaining);state.awarded[k]=true;state.dayXp[today()]=(state.dayXp[today()]||0)+reward;addXp(reward)}save();render()};
let finish=()=>{if(setsTotal()===0||setsDone()<setsTotal()){badge('Отметь выполненные подходы');return}if(state.finished[today()]){badge('Сегодня награда уже получена');return}state.finished[today()]=true;addXp(30);state.view='reward';render()};
let heroIndex=()=>{let s=state.previewStage||stage();if(s===1)return 0;if(s===2)return 1;if(s===3)return state.style===1?3:state.style===2?4:2;if(s===4)return state.style===2?4:state.style===0?2:3;return state.style===2?4:3};
const btn=(label,onclick,style='')=>`<button class="btn ${style}" data-action="${onclick}">${label}</button>`;
function mainHero(){let st=state.previewStage||stage();return `<div class="heroScene"><div class="sky"></div><div class="mount a"></div><div class="mount b"></div><div class="ground"></div><div class="yurt"></div><div class="wolf">🐺</div><div class="sceneText">ЭТАП ${st} · ${esc(ranks[st])}</div><img class="heroArtwork" src="${HERO_IMAGES[heroIndex()]}" alt="Персонаж ${esc(ranks[st])}"></div>
<div class="heroStats"><div class="lvl"><small>УР.</small><b>${level()}</b></div><div class="grow"><strong>${esc(ranks[stage()])}</strong><div class="small">${state.xp} XP · до нового уровня ${200-state.xp%200} XP</div>${progress(state.xp%200/2)}</div></div>
<div class="grid"><div class="card"><h2>⚔ Сила</h2><div>${Math.floor(state.xp/40)+1}</div></div><div class="card"><h2>♥ Выносливость</h2><div>${Math.floor(state.xp/55)+1}</div></div></div>
<div class="card"><h2>Продолжить путь</h2><p>Сегодня выполнено ${setsDone()} из ${setsTotal()} подходов</p>${progress(setsTotal()?setsDone()/setsTotal()*100:0)}<div style="height:12px"></div>${btn('Начать тренировку','go-workout')}</div>
<div class="card"><div class="caps">ВЫБОР ОБРАЗА</div><div class="row">${['Атлет','Воин','Аниме'].map((x,i)=>btn(x,`style:${i}`,state.style===i?'':'secondary')).join('')}</div><p>Стиль сохраняется, а тело героя развивается по уровням. На первых уровнях он остаётся худым новичком.</p><div class="small">Посмотреть этап развития (демо, уровень не меняется):</div><input type="range" min="1" max="5" value="${st}" id="stageRange"><div class="center small">Этап ${st} — ${esc(ranks[st])}</div></div>`}
function workout(){return `<div class="title">Моя тренировка</div><div class="muted small">Создавай собственные задания и увеличивай сложность постепенно.</div>
<div class="card"><div class="caps">СЕГОДНЯШНИЙ ПУТЬ</div><h2>${setsDone()} / ${setsTotal()} подходов</h2>${progress(setsTotal()?setsDone()/setsTotal()*100:0)}<p>XP за полноценную тренировку: ${state.dayXp[today()]||0} сегодня</p><div class="row">${btn('＋ Добавить упражнение','add')}${btn('Изменить план','manage','secondary')}</div></div>
${state.ex.length===0?'<div class="card">План пуст. Добавь первое упражнение, например 15 отжиманий.</div>':''}
${state.ex.map((x,idx)=>`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="caps">ЗАДАНИЕ ${idx+1}</div><h2 style="margin-bottom:0">${esc(x.name)}</h2></div><span class="pill">${x.amount} ${x.kind==='Секунды'?'сек.':'раз'} × ${x.sets}</span></div><p>${x.weight?`${x.weight} кг · `:''}${x.kind} · ${x.sets} подходов</p>${Array.from({length:x.sets},(_,i)=>`<label class="checkrow"><span>Подход ${i+1} · ${x.amount} ${x.kind==='Секунды'?'сек.':'повторений'}</span><input type="checkbox" data-action="check:${x.id}:${i+1}" ${isDone(x,i+1)?'checked':''}></label>`).join('')}
<div class="row" style="margin-top:12px">${btn('▶ Начать',`start:${x.id}`)}${btn('✎ Изменить',`edit:${x.id}`,'secondary')}</div></div>`).join('')}
<div class="card">${btn('🏆 Завершить тренировку','finish')}<p>XP выдаётся за полноценную тренировку один раз в день. Перерывы и восстановление тоже важны.</p></div>`}
function quests(){return `<div class="title">Задания</div><div class="card"><div class="caps">ИСПЫТАНИЕ СИЛЫ</div><h2>Заверши тренировку дня</h2><p>Выполнено ${setsDone()} из ${setsTotal()} подходов</p>${progress(setsTotal()?setsDone()/setsTotal()*100:0)}<p>Награда: XP за полноценную тренировку</p>${btn(state.finished[today()]?'Награда получена ✓':'Завершить испытание',state.finished[today()]?'noop':'finish')}</div><div class="card"><h2>Этапы становления</h2>${ranks.slice(1).map((r,i)=>`<div class="checkrow"><span>${i+1}. ${esc(r)}</span><span class="pill">${['1–10','11–25','26–50','51–75','76–100'][i]} ур.</span></div>`).join('')}</div>`}
function music(){return `<div class="title">♫ Музыка</div><div class="card"><h2>Музыка без выхода из игры</h2><p>Выбери свой аудиофайл. Музыка продолжит звучать при переключении игровых экранов.</p><label>Аудиофайл с телефона</label><input class="field" type="file" id="audioFile" accept="audio/*"><label>Прямая HTTPS-ссылка на аудиопоток</label><input id="audioURL" class="field" placeholder="https://.../audio.mp3">${btn('▶ Слушать онлайн','play-url')}<div style="height:8px"></div>${btn('⏯ Пауза / Продолжить','pause','secondary')}<div style="height:8px"></div>${btn('■ Стоп','stop','secondary')}<p>Интеграции Spotify и Apple Music пока нет; для них нужны официальные API и авторизация.</p></div>`}
function progressScreen(){return `<div class="title">Мой прогресс</div><div class="card"><h2>Уровень ${level()} · ${state.xp} XP</h2><p>Текущий ранг — ${esc(ranks[stage()])}</p>${progress(state.xp%200/2)}<p>Выполнено сегодня: ${setsDone()} подходов</p></div><div class="card"><h2>Цели</h2><label>Масса тела, кг</label><input id="weight" class="field" type="number" min="25" max="400" step="0.1" value="${state.weight}"><label>Целевой вес, кг</label><input id="goal" class="field" type="number" min="25" max="400" step="0.1" value="${state.goal}">${btn('Сохранить показатели','save-weight')}</div>`}
function sessionScreen(){const x=state.ex.find(e=>e.id===session?.id);if(!x){state.view='workout';return workout()}return `<div class="focus">${btn('‹ Назад к тренировке','go-workout','secondary')}<div style="height:34px"></div><div class="caps center">ИСПЫТАНИЕ БАТЫРА · ПОДХОД ${session.set} / ${x.sets}</div><h1 class="center">${esc(x.name)}</h1><figure><div class="emoji">${x.name.includes('Вело')?'🚴':x.name.includes('Планк')?'🧘':'💪'}</div></figure><div class="counter">${session.counter} / ${x.amount}</div><p class="center muted">${x.kind==='Секунды'?'секунд':'повторений'}</p>${progress(session.counter/x.amount*100)}<div style="height:22px"></div>${btn(`＋ ${x.kind==='Секунды'?'1 секунда':'1 повторение'}`,'plus')}<div style="height:9px"></div>${btn('Я выполнил всё','all','secondary')}<div style="height:9px"></div>${btn('✓ Отметить подход выполненным','complete',session.counter>=x.amount?'':'secondary')}<p class="small center">Подтверждай только реально выполненные упражнения.</p></div>`}
function reward(){return `<div class="center" style="padding-top:75px"><div style="font-size:75px">🏆</div><div class="caps">ТРЕНИРОВКА ЗАВЕРШЕНА</div><h1 style="color:var(--gold)">+30 XP</h1><h2>Путь батыра продолжается!</h2><p class="muted">Ты выполнил выбранные задания. Герой стал ещё на шаг ближе к следующему уровню.</p>${btn('Вернуться к герою','go-hero')}</div>`}
function render(){save();$('lvlHeader').textContent='Ур. '+level();const nav=[['hero','♛','Герой'],['workout','⚔','Тренировка'],['quests','✓','Задания'],['music','♫','Музыка'],['progress','▥','Прогресс']];$('main').innerHTML=({hero:mainHero,workout,quests,music,progress:progressScreen,session:sessionScreen,reward})[state.view]();$('nav').innerHTML=nav.map(([id,icon,label])=>`<button class="${state.view===id?'active':''}" data-action="go-${id}"><i>${icon}</i>${label}</button>`).join('');$('musicStrip').innerHTML=audio.src?`<div class="miniplayer"><span>♫</span><span style="flex:1">${esc(audioName)}</span><button data-action="pause">⏯</button></div>`:'';const range=$('stageRange');if(range)range.oninput=()=>{state.previewStage=+range.value;render()};const picker=$('audioFile');if(picker)picker.onchange=()=>{if(picker.files[0]){audio.src=URL.createObjectURL(picker.files[0]);audioName=picker.files[0].name;audio.play().catch(()=>badge('Нажми воспроизведение'));render()}}}
function form(x){let edit=Boolean(x);x=x||{id:uid(),name:'',kind:'Повторения',amount:15,sets:1,weight:0};$('modal').innerHTML=`<div class="overlay" id="overlay"><div class="dialog"><h2>${edit?'Изменить упражнение':'Новое испытание'}</h2><form id="exerciseForm"><label>Название</label><input id="exName" maxlength="70" class="field" required placeholder="Например: отжимания" value="${esc(x.name)}"><label>Тип задания</label><select id="exKind" class="field"><option ${x.kind==='Повторения'?'selected':''}>Повторения</option><option ${x.kind==='Секунды'?'selected':''}>Секунды</option></select><label>Сколько раз / секунд</label><input id="exAmount" class="field" required type="number" min="1" max="10000" value="${x.amount}"><label>Подходов</label><input id="exSets" class="field" required type="number" min="1" max="12" value="${x.sets}"><label>Вес снаряда, кг (необязательно)</label><input id="exWeight" class="field" type="number" step="0.5" min="0" max="1000" value="${x.weight}"><button type="submit" class="btn">Сохранить</button></form><div style="height:8px"></div>${edit?btn('Удалить упражнение',`delete:${x.id}`,'secondary'):btn('Выбрать из библиотеки','presets','secondary')}<div style="height:8px"></div>${btn('Отмена','close','tertiary')}</div></div>`;const f=$('exerciseForm');f.onsubmit=e=>{e.preventDefault();const name=$('exName').value.trim(),amount=+$('exAmount').value,sets=+$('exSets').value,weight=+$('exWeight').value||0;if(!name||amount<1||amount>10000||sets<1||sets>12||weight<0){badge('Проверь значения');return}let obj={id:x.id,name,kind:$('exKind').value,amount,sets,weight};let k=state.ex.findIndex(v=>v.id===x.id);if(k<0)state.ex.push(obj);else state.ex[k]=obj;close();state.view='workout';render()}}
function presets(){const list=[['Отжимания',15,'Повторения'],['Приседания',20,'Повторения'],['Подтягивания',5,'Повторения'],['Жим лёжа',10,'Повторения'],['Становая тяга',8,'Повторения'],['Планка',30,'Секунды'],['Велотренажёр',600,'Секунды'],['Ходьба',900,'Секунды']];$('modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>Библиотека упражнений</h2>${list.map((x,i)=>`<div class="exercise"><div><strong>${x[0]}</strong><br><span>${x[1]} ${x[2]==='Секунды'?'сек.':'раз'}</span></div><button class="square" data-action="preset:${i}">＋</button></div>`).join('')}${btn('Закрыть','close','secondary')}</div></div>`;window.presetsList=list}
function close(){$('modal').innerHTML=''}
document.addEventListener('click',e=>{let target=e.target.closest('[data-action]');if(!target)return;const [key,v,i]=target.dataset.action.split(':');if(key==='go-hero'||key==='go-workout'||key==='go-quests'||key==='go-music'||key==='go-progress'){state.view=key.slice(3);render();return}switch(key){case 'style':state.style=+v;state.previewStage=0;render();break;case 'add':form();break;case 'edit':form(state.ex.find(x=>x.id===v));break;case 'check':book(state.ex.find(x=>x.id===v),+i);break;case 'manage':presets();break;case 'start':{let x=state.ex.find(y=>y.id===v),n=Array.from({length:x.sets},(_,idx)=>idx+1).find(z=>!isDone(x,z))||1;session={id:v,set:n,counter:0};state.view='session';render();break}case 'plus':{let x=state.ex.find(y=>y.id===session.id);session.counter=Math.min(x.amount,session.counter+1);render();break}case 'all':{let x=state.ex.find(y=>y.id===session.id);session.counter=x.amount;render();break}case 'complete':{let x=state.ex.find(y=>y.id===session.id);if(session.counter<x.amount){badge('Сначала закончи упражнение');return}if(!isDone(x,session.set))book(x,session.set);state.view='workout';render();break}case 'finish':finish();break;case 'save-weight':{let w=+$('weight').value,g=+$('goal').value;if(!(w>=25&&w<=400&&g>=25&&g<=400)){badge('Проверь вес');return}state.weight=w;state.goal=g;save();badge('Показатели сохранены');render();break}case 'play-url':{let u=$('audioURL').value.trim();if(!u.startsWith('https://')){badge('Нужна прямая HTTPS-ссылка');return}audio.src=u;audioName='Интернет-аудио';audio.play().catch(()=>badge('Не удалось открыть поток'));render();break}case 'pause':audio.paused?audio.play().catch(()=>badge('Не удалось воспроизвести')):audio.pause();break;case 'stop':audio.pause();audio.removeAttribute('src');audioName='Музыка не выбрана';render();break;case 'close':close();break;case 'presets':presets();break;case 'preset':{let [name,amount,kind]=window.presetsList[+v];form({id:uid(),name,amount,kind,sets:1,weight:0});break}case 'delete':{state.ex=state.ex.filter(x=>x.id!==v);close();render();break}case 'noop':break;}});
render();

</script><script>
(function() {
  const prevHero=mainHero;
  mainHero=function(){
    let out=prevHero();
    const stages=['Новичок','Развитие','Сила','Атлет','Легенда'];
    const line='<div class="stageLine">'+stages.map((name,index)=>'<span class="'+((index+1)===stage()?'on':'')+'">'+(index+1)+'. '+name+'</span>').join('')+'</div>';
    out=line+out;
    out=out.replace('<div class="grid">','<div class="gameRow">');
    out=out.replace('<div class="card"><h2>Продолжить путь</h2>', '<div class="card"><h2>⚔ Сегодняшнее испытание</h2>');
    return out;
  };
  const oldWorkout=workout;
  workout=function(){
    let out=oldWorkout();
    out=out.replace('<div class="title">Моя тренировка</div>',
      '<div class="title">⚔ Мои тренировки</div><div class="row" style="margin:12px 0"><button class="btn" data-action="go-workout">Мои упражнения</button><button class="btn secondary" data-action="presets">Библиотека</button></div>');
    return out;
  };
  reward=function(){
    return '<div style="padding-top:48px;text-align:center"><div style="font-size:65px">🏆</div><div class="rewardHeader">ТРЕНИРОВКА ЗАВЕРШЕНА!</div><div class="rewardXp">+30 XP</div><div class="muted">Дополнительная награда за тренировку</div><div class="rewardStats"><div>💪 Сила <b>+1</b></div><div>❤️ Выносливость <b>+1</b></div><div>🛡️ Стойкость <b>+1</b></div><div>⚡ Энергия <b>+1</b></div></div><div style="text-align:left"><span class="caps">ПУТЬ К НОВОМУ УРОВНЮ</span><p>'+level()+' уровень · '+state.xp+' XP</p>'+progress(state.xp%200/2)+'</div><div style="height:25px"></div>'+btn('Продолжить путь','go-hero')+'</div>';
  };
  window.importNativeData=function(old) {
    if(localStorage.getItem('batyrs-way-native-imported-v05')) return;
    try {
      if(old && old.hasXp) state.xp=Math.max(0,Number(old.xp)||0);
      if(old && old.hasExercises && Array.isArray(old.exercises)) {
        state.ex=old.exercises.filter(x=>x.id&&x.name).map(x=>({
          id:String(x.id),name:String(x.name),kind:x.type==='Секунды'?'Секунды':'Повторения',
          amount:Math.max(1,Number(x.amount)||1),sets:Math.max(1,Number(x.sets)||1),weight:Number(x.weight)||0
        }));
      }
      if(old&&old.hasWeight) state.weight=Number(old.weight)||125;
      if(old&&old.hasGoal) state.goal=Number(old.goal)||100;
      if(old&&old.done) Object.assign(state.done,old.done);
      if(old&&old.awarded) Object.assign(state.awarded,old.awarded);
      if(old&&old.dayXp) Object.assign(state.dayXp,old.dayXp);
      if(old&&old.finished) Object.assign(state.finished,old.finished);
    } catch(e){console.warn('Migration skipped',e)}
    localStorage.setItem('batyrs-way-native-imported-v05','1');
    save();render();
  };
  window.handleHardwareBack=function(){
    if(document.getElementById('modal').innerHTML){close();return true}
    if(state.view==='session'||state.view==='reward'){state.view='workout';render();return true}
    if(state.view!=='hero'){state.view='hero';render();return true}
    return false;
  };
  render();
})();
</script><script src="v06.js"></script><script src="v07.js"></script><script src="v08.js"></script><script src="v09.js"></script><script src="v10.js"></script></body></html>
