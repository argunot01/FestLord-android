name: Build Batyr's Way APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "SDK manager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate game rules and JavaScript
        run: |
          node --check app/src/main/assets/v06.js
          node --check app/src/main/assets/v07.js
          node --check app/src/main/assets/v08.js
          node --check app/src/main/assets/v09.js
          node --check app/src/main/assets/v10.js
          node --check app/src/main/assets/v11.js
          node --check app/src/main/assets/v12.js
          node tests/xp-guide.test.js
          node tests/attributes.test.js
          node tests/full_player.test.js
          node tests/music.test.js
          node tests/progression.test.js
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump permissions "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatyrsWay-v1.3-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
